<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Диагностика автоскролла</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px 60px;
    font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #000; color: #f5f5f7;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px;
  }
  .sub { color: #6e6e73; font-size: 15px; margin: 0 0 28px; }
  .card {
    background: #1c1c1e; border-radius: 12px; padding: 16px 18px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; font-size: 15px; }
  .row .k { color: #6e6e73; flex: 1; }
  .row .v { font-weight: 600; text-align: right; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; align-self: center; }
  .ok   { background: #30d158; }
  .bad  { background: #ff453a; }
  .wait { background: #8e8e93; }
  #verdict {
    border-radius: 12px; padding: 20px; margin: 4px 0 22px; font-size: 17px; line-height: 1.45;
    background: #1c1c1e; border: 1px solid #2c2c2e;
  }
  #verdict b { display: block; font-size: 19px; margin-bottom: 8px; letter-spacing: -0.01em; }
  #verdict.good { background: rgba(48,209,88,0.12);  border-color: rgba(48,209,88,0.4); }
  #verdict.warn { background: rgba(255,214,10,0.12); border-color: rgba(255,214,10,0.4); }
  #verdict.err  { background: rgba(255,69,58,0.12);  border-color: rgba(255,69,58,0.4); }
  .steps { font-size: 15px; line-height: 1.5; color: #d1d1d6; margin: 10px 0 0; padding-left: 20px; }
  .steps li { margin-bottom: 6px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: #6e6e73; margin: 26px 0 10px; font-weight: 600; }
  iframe { width: 100%; height: 320px; border: 0; border-radius: 12px; background: #111; }
  code { font-size: 13px; color: #6e6e73; word-break: break-all; }
</style>
</head>
<body>

<h1>Диагностика автоскролла</h1>
<p class="sub">Открой эту страницу на iPhone. Проверка идёт сама, займёт ~20 секунд.</p>

<div id="verdict"><b>Проверяю…</b>Не закрывай страницу и не сворачивай Safari — в фоне таймеры останавливаются, и результат будет неверным.</div>

<h2>Устройство</h2>
<div class="card" id="env"></div>

<h2>Версия сайта на этом телефоне</h2>
<div class="card" id="ver"></div>

<h2>Живая карусель</h2>
<div class="card" id="live"></div>
<iframe id="frame" src="index.html" title="Проверка карусели"></iframe>

<script>
(function () {
  var envEl = document.getElementById('env');
  var verEl = document.getElementById('ver');
  var liveEl = document.getElementById('live');
  var verdict = document.getElementById('verdict');

  function row(host, key, value, state) {
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<span class="dot ' + state + '"></span><span class="k">' + key +
                  '</span><span class="v">' + value + '</span>';
    host.appendChild(d);
    return d;
  }

  /* ── 1. Устройство ─────────────────────────────────────────── */
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hoverable = window.matchMedia && window.matchMedia('(hover: hover)').matches;

  row(envEl, 'Уменьшение движения', reduced ? 'ВКЛЮЧЕНО' : 'выключено', reduced ? 'bad' : 'ok');
  row(envEl, 'Курсор (hover)', hoverable ? 'есть' : 'нет — тач', 'ok');
  row(envEl, 'Ширина экрана', window.innerWidth + ' px', 'ok');
  row(envEl, 'Движок', /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent)
        ? 'WebKit (Safari)' : 'другой', 'ok');

  /* ── 2. Свежесть кода: маркеры, которых нет в старой версии ── */
  var fresh = null;
  fetch('index.html', { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      // маркеры правки: фокус-пауза и своя rAF-анимация вместо scrollTo smooth
      fresh = t.indexOf('focus-visible') > -1 && t.indexOf('easeApple') > -1;
      var hoverPause = t.indexOf("addEventListener('mouseenter', stop)") > -1;
      row(verEl, 'Свежий код на сервере', fresh ? 'да' : 'НЕТ — старая версия', fresh ? 'ok' : 'bad');
      row(verEl, 'Осталась пауза по курсору', hoverPause ? 'ДА — это баг' : 'нет', hoverPause ? 'bad' : 'ok');
    })
    .catch(function (e) {
      row(verEl, 'Не удалось проверить', String(e), 'bad');
    });

  /* ── 3. Живая проверка карусели в самом сайте ──────────────── */
  var frame = document.getElementById('frame');
  var startedRow = null, movedRow = null, posRow = null;
  var samples = [];

  frame.addEventListener('load', function () {
    var doc, track;
    try {
      doc = frame.contentDocument;
      track = doc.getElementById('carouselTrack');
    } catch (e) {
      row(liveEl, 'Нет доступа к странице', String(e), 'bad');
      return;
    }
    if (!track) { row(liveEl, 'Карусель не найдена', '—', 'bad'); return; }

    track.scrollIntoView({ block: 'center' });
    startedRow = row(liveEl, 'Карусель загрузилась', 'да', 'ok');
    posRow = row(liveEl, 'Позиция ленты', '…', 'wait');
    movedRow = row(liveEl, 'Сдвинулась сама', 'ждём 16 с…', 'wait');

    var t0 = Date.now();
    var iv = setInterval(function () {
      var x = Math.round(track.scrollLeft);
      samples.push(x);
      posRow.querySelector('.v').textContent = x + ' px';
      var moved = samples.length > 1 && Math.max.apply(null, samples) - Math.min.apply(null, samples) > 20;
      if (moved || Date.now() - t0 > 16000) {
        clearInterval(iv);
        movedRow.querySelector('.v').textContent = moved ? 'ДА' : 'НЕТ';
        movedRow.querySelector('.dot').className = 'dot ' + (moved ? 'ok' : 'bad');
        finish(moved);
      }
    }, 1000);
  });

  /* ── 4. Вывод ──────────────────────────────────────────────── */
  var done = false;
  // страховка: вердикт показываем в любом случае, даже если iframe не открылся
  setTimeout(function () { finish(false); }, 20000);
  // настройка движения — самодостаточный ответ, ждать карусель незачем
  if (reduced) setTimeout(function () { finish(false); }, 300);

  function finish(moved) {
    if (done) return;
    done = true;
    if (reduced) {
      verdict.className = 'warn';
      verdict.innerHTML = '<b>Причина найдена: включено «Уменьшение движения»</b>' +
        'На этом iPhone включена настройка, по которой сайты обязаны отключать автоматическое движение. ' +
        'Карусель это уважает и не листается сама — свайп пальцем при этом работает.' +
        '<ol class="steps"><li>Настройки → Универсальный доступ → Движение</li>' +
        '<li>Выключи «Уменьшение движения»</li>' +
        '<li>Вернись на сайт и обнови страницу</li></ol>' +
        'Если выключать не хочешь — скажи мне, и я сделаю автоскролл принудительным, независимо от этой настройки.';
      return;
    }
    if (moved) {
      verdict.className = 'good';
      verdict.innerHTML = '<b>Автоскролл на этом iPhone работает</b>' +
        'Лента сдвинулась сама, прямо здесь. Значит в обычной вкладке у тебя открыта старая версия из кеша Safari.' +
        '<ol class="steps"><li>Закрой вкладку с сайтом</li>' +
        '<li>Открой <b>приватную вкладку</b> (кнопка вкладок → «Частный доступ») и зайди на сайт заново — приватная вкладка не берёт кеш</li>' +
        '<li>Если помогло: Настройки → Safari → Очистить историю и данные, чтобы починить обычную вкладку</li></ol>';
      return;
    }
    verdict.className = 'err';
    verdict.innerHTML = '<b>' + (samples.length ? 'Автоскролл не пошёл даже здесь' : 'Проверка не завершилась') + '</b>' +
      'Настройки движения ни при чём — причина в другом. Пришли мне скриншот этой страницы целиком, ' +
      'вместе с блоками «Устройство» и «Версия сайта», и я разберусь дальше.' +
      '<p class="steps">Замеры позиции: <code>' + samples.join(' → ') + '</code></p>';
  }
})();
</script>

</body>
</html>
