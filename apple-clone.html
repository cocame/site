<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Продукт 1</title>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   ЧАСТЬ 1 — шапка и первый экран.
   Числа сняты замером с apple.com (WebKit, окна 1440×900 и 2880×1700).
   Дальше добавляем блоки по одному.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  --black:  #000000;
  --white:  #ffffff;
  --blue:   #0066cc;          /* цвет ссылок Apple */
  --nav-h:  44px;             /* высота панели у apple.com — ровно 44px */
  --tile-h: 692px;            /* высота полноэкранной плитки */
  --gap:    12px;             /* зазор между плитками */
  --ease:   cubic-bezier(0.25, 0.1, 0.25, 1);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--white);
  color: var(--black);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
               "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }


/* ─────────── ШАПКА ─────────── */

.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 9999;
  height: var(--nav-h);
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
}

.nav__row {
  max-width: 980px;           /* внутренний ряд у Apple — 980px */
  height: 100%;
  margin: 0 auto;
  padding: 0 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav__menu {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: 1;
  list-style: none;
  margin: 0;
  padding: 0;
}

.nav__link {
  font-size: 12px;
  line-height: 1;
  color: rgba(255, 255, 255, 0.8);
  transition: color 0.3s var(--ease);
  white-space: nowrap;
}
.nav__link:hover { color: var(--white); }

.nav__burger {
  display: none;
  width: 24px; height: 24px;
  padding: 0; border: 0; background: none;
  cursor: pointer;
}
.nav__burger span {
  display: block;
  width: 17px; height: 1px;
  margin: 4px auto;
  background: var(--white);
  transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);
}
.nav__burger.is-open span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
.nav__burger.is-open span:nth-child(2) { opacity: 0; }
.nav__burger.is-open span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }


/* ─────────── ПЛИТКА (базовый блок всей страницы) ───────────
   У Apple вся главная собрана из плиток одного устройства:
   фиксированная высота, текст сверху по центру, изображение снизу. */

.page { padding-top: var(--nav-h); }

.tile {
  position: relative;
  height: var(--tile-h);
  margin-bottom: var(--gap);
  overflow: hidden;
  text-align: center;
  background: var(--white);
  color: var(--black);
}
.tile--dark { background: var(--black); color: var(--white); }

.tile__text {
  position: relative;
  z-index: 2;
  padding-top: 56px;          /* замер apple.com: 53–57px */
}

.tile__title {
  margin: 0;
  font-size: 56px;
  line-height: 60px;
  font-weight: 600;
  letter-spacing: -0.005em;
}

.tile__sub {
  margin: 6px 0 0;
  font-size: 28px;
  line-height: 32px;
  font-weight: 400;
}

/* Ряд синих ссылок со стрелкой — фирменный элемент Apple */
.links {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin-top: 12px;
}
.link {
  font-size: 21px;
  line-height: 25px;
  color: var(--blue);
}
.link:hover { text-decoration: underline; }
.link::after { content: " \203A"; }

/* ▼ СЮДА ВСТАВЛЯТЬ ИЗОБРАЖЕНИЕ ПРОДУКТА ▼
   Занимает низ плитки, обрезается по краям. */
.tile__media {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  top: 208px;
  z-index: 1;
}
.tile__media img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
}

/* Заглушка, пока нет фото: ровная заливка без рамок и градиентов */
.placeholder { width: 100%; height: 100%; background: #d9d9d9; }
.tile--dark .placeholder { background: #141414; }


/* ─────────── ПЛАНШЕТ И ТЕЛЕФОН ─────────── */

@media (max-width: 1068px) {
  .tile__title { font-size: 48px; line-height: 52px; }
  .tile__sub   { font-size: 24px; line-height: 28px; }
}

@media (max-width: 734px) {
  :root { --tile-h: 520px; }

  .tile__text  { padding-top: 40px; }
  .tile__title { font-size: 32px; line-height: 36px; }
  .tile__sub   { font-size: 19px; line-height: 23px; }
  .link        { font-size: 17px; }
  .tile__media { top: 168px; }

  .nav__burger { display: block; }
  .nav__menu {
    position: fixed;
    top: var(--nav-h); left: 0; right: 0;
    flex-direction: column;
    align-items: stretch;
    padding: 0 22px;
    background: rgba(0, 0, 0, 0.94);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s var(--ease);
  }
  .nav__menu.is-open { max-height: 70vh; }
  .nav__link { display: block; padding: 15px 0; font-size: 17px; }
}
</style>
</head>

<body>

<!-- ═══════════ ШАПКА ═══════════ -->
<header class="nav">
  <nav class="nav__row" aria-label="Основная навигация">
    <ul class="nav__menu" id="navMenu">
      <li><a class="nav__link" href="#">Главная</a></li>
      <li><a class="nav__link" href="#">Продукт 1</a></li>
      <li><a class="nav__link" href="#">Продукт 2</a></li>
      <li><a class="nav__link" href="#">Продукт 3</a></li>
      <li><a class="nav__link" href="#">Продукт 4</a></li>
      <li><a class="nav__link" href="#">Поддержка</a></li>
    </ul>
    <button class="nav__burger" id="navBurger" aria-label="Меню" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>
</header>

<main class="page">

  <!-- ═══════════ ПЛИТКА 1 — первый экран, тёмная ═══════════ -->
  <section class="tile tile--dark">
    <div class="tile__text">
      <h1 class="tile__title">Продукт 1</h1>
      <p class="tile__sub">Короткий подзаголовок в одну строку.</p>
      <div class="links">
        <a class="link" href="#">Подробнее</a>
        <a class="link" href="#">Купить</a>
      </div>
    </div>
    <div class="tile__media">
      <!-- ▼ ЗАМЕНИТЬ НА <img src="..." alt="Продукт 1"> ▼ -->
      <div class="placeholder"></div>
    </div>
  </section>

</main>

<script>
/* Мобильное меню: бургер открывает список, выбор пункта закрывает. */
(function () {
  var burger = document.getElementById('navBurger');
  var menu   = document.getElementById('navMenu');

  function toggle(open) {
    burger.classList.toggle('is-open', open);
    menu.classList.toggle('is-open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  burger.addEventListener('click', function () {
    toggle(!menu.classList.contains('is-open'));
  });
  menu.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () { toggle(false); });
  });
  window.addEventListener('resize', function () {
    if (window.innerWidth > 734) toggle(false);
  });
})();
</script>

</body>
</html>
